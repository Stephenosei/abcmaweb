<body>
    
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <h2 class="text-center">Employee Login</h2>
                <form id="login-form">
                    <div class="form-group">
                        <label for="username">Username</label>
                        <input type="text" class="form-control" id="username" placeholder="Enter username" required>
                    </div>
                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" class="form-control" id="password" placeholder="Enter password" required>
                    </div>
                    <button type="submit" class="btn btn-primary btn-block">Login</button>
                </form>
            </div>
        </div>
    </div>
    
    <div class="container mt-5" id="upload-section" style="display:none;">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <h2 class="text-center">Upload News</h2>
                <form id="upload-form" enctype="multipart/form-data">
                    <div class="form-group">
                        <label for="title">Title</label>
                        <input type="text" class="form-control" id="title" placeholder="Enter news title" required>
                    </div>
                    <div class="form-group">
                        <label for="content">Content</label>
                        <textarea class="form-control" id="content" rows="5" placeholder="Enter news content" required></textarea>
                    </div>
                    <div class="form-group">
                        <label for="file">Upload Image</label>
                        <input type="file" class="form-control-file" id="file" required>
                    </div>
                    <button type="submit" class="btn btn-success btn-block">Upload</button>
                </form>
            </div>
        </div>
    </div>
    
    <script>
        // Example JavaScript for form handling
        document.getElementById('login-form').addEventListener('submit', function(event) {
            event.preventDefault();
            // Authentication logic here (e.g., AJAX to server)
            document.getElementById('upload-section').style.display = 'block';
        });
    
        document.getElementById('upload-form').addEventListener('submit', function(event) {
            event.preventDefault();
            // Upload logic here (e.g., AJAX to server)
            alert('News uploaded successfully!');
        });
    </script>
